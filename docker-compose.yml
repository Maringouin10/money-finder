services:
  # Lance la collecte puis écrit le rapport dans ./output
  scraper:
    build: .
    image: money-finder
    env_file:
      - .env
    volumes:
      - ./output:/app/output
    # surchargeable : docker compose run --rm scraper -k "infinity cube" -l 100
    command: ["--commercial-only"]

  # Sert le rapport sur http://localhost:8081. Au démarrage, aucune collecte
  # n'est lancée : la page affiche un formulaire pour choisir les mots-clés
  # et les plateformes, avec un bouton « Démarrer la collecte »
  # (rafraîchissement automatique en plus toutes les REFRESH_HOURS heures si défini).
  web:
    image: money-finder
    build: .
    env_file:
      - .env
    entrypoint: ["python", "-m", "scraper.serve"]
    command: ["--port", "8081", "--directory", "/app/output"]
    volumes:
      - ./output:/app/output
    ports:
      - "${WEB_PORT:-8081}:8081"
    restart: unless-stopped
